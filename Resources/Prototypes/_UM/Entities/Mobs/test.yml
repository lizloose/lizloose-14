- type: entity
  id: EnergyTestMonkey
  name: energy test
  parent: MobMonkey
  components:
  - type: ActionGrant
    actions:
    - ActionFireballTestEnergy
  - type: EnergyContainer
    types:
    - name: fart
      amount: 69
      updateAmount: 1
      alert: Essence
    - name: asdfad
      amount: 1
      updateAmount: 4
      alert: Essence2



- type: entity
  parent: BaseAction
  id: ActionFireballTestEnergy
  name: Fireball
  description: Fires an explosive fireball towards the clicked location.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFireball
  - type: SpeakOnAction
    sentence: action-speech-spell-fireball
  - type: EnergyActionRequirement
    name: fart
    amount: 5

