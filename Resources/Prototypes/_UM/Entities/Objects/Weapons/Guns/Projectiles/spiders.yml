- type: entity
  id: ProjectileSpiderBolt
  name: spider thing
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: declone
  - type: Projectile
    damage:
      types:
        Caustic: 15
    ignoreResistances: true
    impactEffect: BulletImpactEffectGreenNurseSpider
    soundHit:
      collection: MeatLaserImpact
  - type: ProjectileWhitelist
    whitelist:
      tags:
      - Spider
    whitelistDamage:
      types: # good enough. Maybe make it call the rejuvenate command later.
        Asphyxiation: -10
        Bloodloss: -10
        Blunt: -10
        Caustic: -10
        Cold: -10
        Heat: 1
        Piercing: -10
        Poison: -10
        Radiation: -10
        Shock: -10
        Slash: -10

- type: entity
  id: BulletImpactEffectGreenNurseSpider
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.2
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
      state: impact_laser_greyscale
      color: greenyellow
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
