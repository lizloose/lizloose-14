- type: entity
  parent: BaseGameRule
  id: UMSubGamemodesRule
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.75
    - id: Victim
      prob: 0.5
    - id: SubWizard
      prob: 0.01

- type: entity
  id: UMBasicStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: UMBasicGameRulesTable

# event schedulers
- type: entityTable
  id: UMBasicGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - !type:NestedSelector
      tableId: UMBasicCalmEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable

- type: entity
  id: Victim
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 25
  - type: AntagSelection
    agentName: victim-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Victim ]
      max: 3
      playerRatio: 15
      briefing:
        text: victim-role-greeting
        color: Red
      components:
      - type: Victim
      mindRoles:
      - MindRoleVictim
  - type: AntagRandomObjectives
    sets:
    - groups: VictimObjectiveGroup
      maxPicks: 2
    maxDifficulty: 5

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleVictim
  name: Victim Role
  components:
  - type: MindRole
    antagPrototype: Victim
    subtype: role-subtype-victim
  - type: VictimRole
