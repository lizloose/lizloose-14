- type: entity
  parent: BaseAction
  id: BaseActionSolutionInject
  abstract: true
  components:
  - type: Action
    useDelay: 60
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _UM/Interface/Actions/changeling.rsi
      state: sting_mute
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:SolutionInjectActionEvent
    canTargetSelf: false
    whitelist:
      components:
      - MobState

- type: entity
  parent: BaseActionSolutionInject
  id: ActionStingMute
  name: Mute Sting
  description: We silently sting a human, completely silencing them for a short time. Does not provide a warning to the victim that they have been stung, until they try to speak and cannot.
  components:
  - type: Action
    useDelay: 60
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _UM/Interface/Actions/changeling.rsi
      state: sting_mute
  - type: SolutionInjectAction
    solution:
      reagents:
      - ReagentId: MuteToxin
        Quantity: 6

- type: entity
  parent: BaseAction
  id: ActionExtractGenomeSting
  components:
  - type: Action
    useDelay: 60
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _UM/Interface/Actions/changeling.rsi
      state: sting_extract
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:ExtractGenomeActionEvent
    whitelist:
      components:
      - MobState
  - type: ExtractGenomeAction
