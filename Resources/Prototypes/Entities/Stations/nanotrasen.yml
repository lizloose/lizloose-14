- type: entity
  abstract: true
  id: BaseStationNanotrasen
  components:
    - type: NpcFactionMember
      factions:
        - NanoTrasen
    - type: StationJobArrivals
    - type: StationAmbience
      ambience:
      - DefaultDrone

- type: stationAmbience
  id: DefaultDrone
  sound: !type:SoundPathSpecifier
    params:
      loop: true
      volume: -2
    path: /Audio/Ambience/shipambience.ogg
  conditions:
  - !type:NearPowerCondition
    range: 10

- type: entity
  id: StandardNanotrasenStation
  parent:
    - BaseStation
    - BaseStationNews
    - BaseStationCargo
    - BaseStationJobsSpawning
    - BaseStationRecords
    - BaseStationArrivals
    - BaseStationGateway
    - BaseStationShuttles
    - BaseStationCentcomm
    - BaseStationEvacuation
    - BaseStationAlertLevels
    - BaseStationMagnet
    - BaseStationExpeditions
    - BaseStationSalvageJobs
    - BaseStationSiliconLawCrewsimov
    - BaseStationAllEventsEligible
    - BaseStationNanotrasen
    - BaseStationDeliveries
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform

- type: entity
  id: NanotrasenCentralCommand
  parent:
    - BaseStation
    - BaseStationAlertLevels
    - BaseStationNanotrasen
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform

- type: entity
  id: StandardStationArena
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  - BaseStationNanotrasen
  categories: [ HideSpawnMenu ]
  components:
    - type: Transform
